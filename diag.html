<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Diagnostic QR</title>
<style>
body{font-family:sans-serif;padding:20px;max-width:800px;margin:0 auto}
h1{color:#143c82;font-size:20px}
.m{padding:8px;margin:4px 0;background:#f0f4ff;border-radius:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.m .h{font-family:monospace;font-weight:700;color:#143c82;letter-spacing:1px}
.ok{color:green;font-weight:700}.no{color:red;font-weight:700}
#status{padding:10px;margin:10px 0;border-radius:6px;font-size:14px}
.conn{background:#e8f5e9;color:#2e7d32}.err{background:#ffebee;color:#c62828}.load{background:#fff3e0;color:#e65100}
#scanTest{width:100%;padding:12px;font-size:16px;border:2px solid #143c82;border-radius:8px;margin:12px 0;box-sizing:border-box}
#scanResult{padding:10px;margin:8px 0;border-radius:6px;min-height:20px;font-size:14px;display:none}
button{background:#143c82;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-size:14px;cursor:pointer;margin:4px}
button:active{opacity:0.8}
</style>
</head><body>
<h1>🔍 Diagnostic QR — Arrêts Atelier</h1>
<div id="status" class="load">Connexion à Firebase...</div>
<h3>Machines dans vos Paramètres :</h3>
<div id="machList"></div>
<h3>Test scanner :</h3>
<input id="scanTest" placeholder="Scannez un QR ici ou tapez le code (ex: PXKPOCE)">
<div id="scanResult"></div>
<button onclick="printQR()">🖨️ Imprimer QR depuis VOS machines</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var SAFE="BCDEFGHIJKLNOPRSTUVXY";
function hash4(s){s=String(s==null?"":s).trim().toLowerCase();var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}var o="";for(var k=0;k<4;k++){o+=SAFE.charAt(h%21);h=Math.floor(h/21);}return o;}
function codeMachine(m){return"PXK"+hash4(m);}

var DEFAULTS_MACHINES = [
  "MORI SEIKI 3 axes SV-50 (FNV3-01)",
  "DOOSAN 4 axes DNM 6700 (FNV04-01)",
  "DOOSAN 3 axes DNM 5700 (FNV3-02)",
  "DOOSAN 4 axes NHP 5500 (FNH4-01)",
  "DOOSAN 3 axes PUMA GT 2600M (TCN3G)",
  "DOOSAN 3 axes PUMA DTN 2600M (TCN3D)",
  "DOOSAN 2 axes LYNX 2100 (TCN2)",
  "Tour conventionnelle (TCV)"
];

var machines = [];

var cfg = {"apiKey":"AIzaSyC8VWaR6AwSK9g_JIJWGzCOZOiy7DmNaHc","authDomain":"pilotage-atelier-11efe.firebaseapp.com","projectId":"pilotage-atelier-11efe","storageBucket":"pilotage-atelier-11efe.firebasestorage.app","messagingSenderId":"956804672950","appId":"1:956804672950:web:6832c88296c201226f6517"};

firebase.initializeApp(cfg);
var db = firebase.firestore();

var st = document.getElementById("status");
db.doc("config/arrets").get().then(function(s){
  if(s.exists){
    var d = s.data();
    machines = d.machines || DEFAULTS_MACHINES;
    st.className = "conn";
    st.textContent = "✅ Connecté — " + machines.length + " machines trouvées dans Firebase";
  } else {
    machines = DEFAULTS_MACHINES;
    st.className = "conn";
    st.textContent = "⚠️ Pas de config dans Firebase, utilisation des DEFAULTS (" + machines.length + " machines)";
  }
  showMachines();
}).catch(function(e){
  st.className = "err";
  st.textContent = "❌ Erreur Firebase : " + e.message;
  machines = DEFAULTS_MACHINES;
  showMachines();
});

function showMachines(){
  var el = document.getElementById("machList");
  var html = "";
  for(var i=0;i<machines.length;i++){
    var m = machines[i];
    var code = codeMachine(m);
    var defIdx = DEFAULTS_MACHINES.indexOf(m);
    var match = defIdx >= 0;
    html += '<div class="m"><span>' + esc(m) + '</span><span class="h">' + code +
      (match ? ' <span class="ok">= DEFAULTS ✓</span>' : ' <span class="no">≠ DEFAULTS ✗</span>') + '</span></div>';
  }
  if(machines.length === 0) html = '<div class="m"><span class="no">Aucune machine trouvée!</span></div>';
  el.innerHTML = html;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}

// Scanner test
var scanBox = document.getElementById("scanTest");
var scanRes = document.getElementById("scanResult");
var timer = null;
scanBox.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(testScan,300);});
scanBox.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();testScan();}});

function testScan(){
  var raw = scanBox.value;
  if(!raw){scanRes.style.display="none";return;}
  scanRes.style.display="block";

  var s = String(raw).toUpperCase().replace(/[^A-Z]/g,"");
  var i = s.indexOf("PX");
  if(i<0){scanRes.style.background="#ffebee";scanRes.innerHTML="❌ <b>Pas de 'PX' trouvé</b><br>Raw: "+esc(raw)+"<br>Filtered: "+s;return;}
  s = s.slice(i);
  if(s.length<7){scanRes.style.background="#ffebee";scanRes.innerHTML="❌ <b>Trop court après PX</b> ("+s.length+" chars, min 7)<br>Filtered: "+s;return;}

  var t = s.charAt(2), h = s.slice(3,7);
  if(t!=="K"){scanRes.style.background="#fff3e0";scanRes.innerHTML="⚠️ Type="+t+" (pas machine). Hash="+h;return;}

  var found = null;
  for(var j=0;j<machines.length;j++){
    if(hash4(machines[j])===h){found=machines[j];break;}
  }

  if(found){
    scanRes.style.background="#e8f5e9";
    scanRes.innerHTML="✅ <b>MATCH!</b> Machine: "+esc(found)+"<br>Code: PXK"+h+"<br>Raw: "+esc(raw);
  } else {
    // Check against DEFAULTS too
    var defFound = null;
    for(var j=0;j<DEFAULTS_MACHINES.length;j++){
      if(hash4(DEFAULTS_MACHINES[j])===h){defFound=DEFAULTS_MACHINES[j];break;}
    }
    scanRes.style.background="#ffebee";
    scanRes.innerHTML="❌ <b>PAS DE MATCH</b> dans vos machines!<br>Hash cherché: "+h+"<br>Raw: "+esc(raw)+
      (defFound ? "<br><br>⚠️ Ce QR correspond à <b>DEFAULTS</b>: "+esc(defFound)+"<br>Mais cette machine n'est pas (ou est différente) dans vos Paramètres!" : "");
  }
  scanBox.value="";
}

function printQR(){

  var w=window.open("","_blank");
  var html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>QR Machines</title><style>'+
    '@page{size:A4;margin:12mm}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}'+

    '.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}'+
    '.card{border:2px solid #143c82;border-radius:8px;text-align:center;break-inside:avoid;overflow:hidden;padding-bottom:8px}'+
    '.hdr{background:#143c82;color:#fff;font-weight:700;font-size:8px;padding:5px 4px;letter-spacing:.5px;text-transform:uppercase}'+
    '.qr{padding:8px 12px 4px}.qr svg{width:40mm;height:40mm;display:block;margin:0 auto}'+
    '.code{font-family:monospace;font-size:11px;font-weight:700;color:#143c82;letter-spacing:2px;margin-bottom:4px}'+
